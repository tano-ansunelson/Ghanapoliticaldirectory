name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Ghanapoliticaldirectory.slnx

      - name: Build
        run: dotnet build Ghanapoliticaldirectory.slnx --configuration Release --no-restore

      # Runs only if you add a test project to the solution later.
      - name: Test
        run: dotnet test Ghanapoliticaldirectory.slnx --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish Ghanapoliticaldirectory/Ghanapoliticaldirectory.csproj --configuration Release --no-build --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
